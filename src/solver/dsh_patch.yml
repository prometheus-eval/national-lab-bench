# deepseek-harness (dsh) patch overlay used for the DeepSeek-V4-Pro runs.
# run.sh renders __DEEPSEEK_BASE_URL__ / __DEEPSEEK_MODEL__ into a per-run copy
# and passes it to dsh via SOLVER_DSH_PATCH (`dsh --profile headless --patch <file>`).
# The API key is read by dsh from $DEEPSEEK_API_KEY (never written here).
- id: llm-deepseek
  config:
    baseURL: "__DEEPSEEK_BASE_URL__"
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: __DEEPSEEK_MODEL__
        contextWindow: 1000000
- id: agent-default-model
  config:
    provider: deepseek-official
    model: __DEEPSEEK_MODEL__
- id: bash-sandbox
  config:
    timeoutMs: 14400000
